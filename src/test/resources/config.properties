# ==========================================================
# Default framework configuration.
# Any key here can be overridden with -D<key>=<value> on the
# Maven/TestNG command line, e.g. -Dbrowser=firefox -Denv=remote
# ==========================================================

# chrome | firefox | edge
browser=chrome

# true = run browser headless (recommended for CI)
headless=false

# local | remote  (remote = Selenium Grid or LambdaTest)
execution.mode=local

# grid | lambdatest -- only used when execution.mode=remote
remote.provider=lambdatest

# Selenium Grid hub URL, used when remote.provider=grid
grid.url=http://localhost:4444/wd/hub

# LambdaTest hub URL
lambdatest.url=https://hub.lambdatest.com/wd/hub

# Base URLs under test
base.url=https://www.swift.com
careers.url=https://www.swift.com/about-us/careers

# Timeouts (seconds)
timeout.implicit=5
timeout.explicit=20
timeout.pageload=45

# Window
window.maximize=true

# Screenshots
screenshot.dir=test-output/screenshots

# Broken link checker
link.check.timeout.ms=8000
link.check.max=60
