name: Swift Selenium Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite file'
        required: false
        default: 'testng.xml'
      browser:
        description: 'Browser (chrome/firefox/edge)'
        required: false
        default: 'chrome'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run automated tests (headless)
        id: run-tests
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: >
          mvn -B clean test
          -Dsuite=${{ github.event.inputs.suite || 'testng.xml' }}
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Dheadless=true
        continue-on-error: true

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B surefire-report:report-only || true

      - name: Upload test reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            test-output/**
            target/surefire-reports/**
            target/site/surefire-report.html
            target/allure-results/**
          if-no-files-found: ignore
          retention-days: 15

      - name: Upload Extent report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: test-output/extent-report/**
          if-no-files-found: ignore
          retention-days: 15

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare Allure report directories
        if: always()
        run: |
          mkdir -p allure-history target/allure-results

      - name: Build Allure HTML report
        uses: simple-elf/allure-report-action@v1.9
        if: always() && hashFiles('target/allure-results/**') != ''
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          gh_pages: gh-pages

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && hashFiles('target/allure-results/**') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Write report links to job summary
        if: always()
        run: |
          echo "### Test Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allure report: https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the \`test-reports-${{ github.run_number }}\` artifact for Extent, Surefire, TestNG, screenshots, and Allure results" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow when tests fail
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
